{{- if .Values.airbyte.deployInCluster }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dalgo.fullname" . }}-airbyte-temporal-dynamicconfig
  labels:
    {{- include "dalgo.labels" . | nindent 4 }}
data:
  development.yaml: |
    # Temporal dynamic config - required for startup
    {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dalgo.fullname" . }}-airbyte-config
  labels:
    {{- include "dalgo.labels" . | nindent 4 }}
data:
  VERSION: "0.58.0"
  MICRONAUT_ENVIRONMENTS: "control-plane"
  DATABASE_USER: "docker"
  DATABASE_PASSWORD: "docker"
  DATABASE_HOST: "{{ include "dalgo.fullname" . }}-airbyte-db"
  DATABASE_PORT: "5432"
  DATABASE_DB: "airbyte"
  DATABASE_URL: "jdbc:postgresql://{{ include "dalgo.fullname" . }}-airbyte-db:5432/airbyte"
  TEMPORAL_HOST: "{{ include "dalgo.fullname" . }}-airbyte-temporal:7233"
  INTERNAL_API_HOST: "{{ include "dalgo.fullname" . }}-airbyte-server:8001"
  INTERNAL_API_URL: "http://{{ include "dalgo.fullname" . }}-airbyte-server:8001"
  CONNECTOR_BUILDER_API_HOST: "{{ include "dalgo.fullname" . }}-airbyte-connector-builder-server:8080"
  CONNECTOR_BUILDER_SERVER_API_HOST: "http://{{ include "dalgo.fullname" . }}-airbyte-connector-builder-server:8080"
  WEBAPP_URL: "http://{{ include "dalgo.fullname" . }}-airbyte-proxy:8000/"
  AIRBYTE_API_HOST: "{{ include "dalgo.fullname" . }}-airbyte-api-server:8006"
  STORAGE_TYPE: "S3"
  S3_MINIO_ENDPOINT: "http://{{ include "dalgo.fullname" . }}-airbyte-minio:9000"
  S3_PATH_STYLE_ACCESS: "true"
  AWS_ACCESS_KEY_ID: "minioadmin"
  AWS_SECRET_ACCESS_KEY: "minioadmin"
  AWS_REGION: "us-east-1"
  AWS_DEFAULT_REGION: "us-east-1"
  S3_REGION: "us-east-1"
  STORAGE_BUCKET_LOG: "airbyte-logs"
  STORAGE_BUCKET_STATE: "airbyte-state"
  STORAGE_BUCKET_WORKLOAD_OUTPUT: "airbyte-workload-output"
  STORAGE_BUCKET_ACTIVITY_PAYLOAD: "airbyte-activity-payload"
  CONFIG_ROOT: "/data"
  WORKSPACE_ROOT: "/tmp/workspace"
  LOCAL_ROOT: "/tmp/airbyte_local"
  TRACKING_STRATEGY: "segment"
  SEGMENT_WRITE_KEY: "7UDdp5K55CyiGgsauOr2pNNujGvmhaeu"
  JOB_ERROR_REPORTING_STRATEGY: "logging"
  LOG_LEVEL: "INFO"
  SECRET_PERSISTENCE: "NO_OP"
  BASIC_AUTH_USERNAME: {{ .Values.airbyte.username | default "airbyte" | quote }}
  BASIC_AUTH_PASSWORD: {{ .Values.airbyte.password | default "password" | quote }}
  BASIC_AUTH_PROXY_TIMEOUT: "900"
  JOBS_DATABASE_MINIMUM_FLYWAY_MIGRATION_VERSION: "0.40.26.001"
  CONFIGS_DATABASE_MINIMUM_FLYWAY_MIGRATION_VERSION: "0.40.23.002"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "dalgo.fullname" . }}-airbyte-db-pvc
  labels:
    {{- include "dalgo.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.airbyte.persistence.size | default "10Gi" }}
  {{- if .Values.airbyte.persistence.storageClass }}
  storageClassName: {{ .Values.airbyte.persistence.storageClass | quote }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dalgo.fullname" . }}-airbyte-db
  labels:
    {{- include "dalgo.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "dalgo.fullname" . }}-airbyte-db
  template:
    metadata:
      labels:
        app: {{ include "dalgo.fullname" . }}-airbyte-db
    spec:
      containers:
      - name: db
        image: airbyte/db:0.58.0
        envFrom:
        - configMapRef:
            name: {{ include "dalgo.fullname" . }}-airbyte-config
        env:
        - name: POSTGRES_DB
          value: "airbyte"
        - name: POSTGRES_USER
          value: "docker"
        - name: POSTGRES_PASSWORD
          value: "docker"
        volumeMounts:
        - name: db-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: db-data
        persistentVolumeClaim:
          claimName: {{ include "dalgo.fullname" . }}-airbyte-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dalgo.fullname" . }}-airbyte-db
  labels:
    {{- include "dalgo.labels" . | nindent 4 }}
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: {{ include "dalgo.fullname" . }}-airbyte-db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dalgo.fullname" . }}-airbyte-temporal
  labels:
    {{- include "dalgo.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "dalgo.fullname" . }}-airbyte-temporal
  template:
    metadata:
      labels:
        app: {{ include "dalgo.fullname" . }}-airbyte-temporal
    spec:
      containers:
      - name: temporal
        image: airbyte/temporal:0.58.0
        envFrom:
        - configMapRef:
            name: {{ include "dalgo.fullname" . }}-airbyte-config
        env:
        - name: DB
          value: "postgresql"
        - name: DB_PORT
          value: "5432"
        - name: POSTGRES_USER
          value: "docker"
        - name: POSTGRES_PWD
          value: "docker"
        - name: POSTGRES_SEEDS
          value: "{{ include "dalgo.fullname" . }}-airbyte-db"
        - name: DYNAMIC_CONFIG_FILE_PATH
          value: "config/dynamicconfig/development.yaml"
        volumeMounts:
        - name: dynamic-config
          mountPath: /etc/temporal/config/dynamicconfig
      volumes:
      - name: dynamic-config
        configMap:
          name: {{ include "dalgo.fullname" . }}-airbyte-temporal-dynamicconfig
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dalgo.fullname" . }}-airbyte-temporal
  labels:
    {{- include "dalgo.labels" . | nindent 4 }}
spec:
  ports:
  - port: 7233
    targetPort: 7233
  selector:
    app: {{ include "dalgo.fullname" . }}-airbyte-temporal
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "dalgo.fullname" . }}-airbyte-boot-{{ .Release.Revision }}
  labels:
    {{- include "dalgo.labels" . | nindent 4 }}
spec:
  ttlSecondsAfterFinished: 180
  template:
    metadata:
      labels:
        app: {{ include "dalgo.fullname" . }}-airbyte-bootloader
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-db
        image: busybox
        command: ['sh', '-c', 'until nc -z {{ include "dalgo.fullname" . }}-airbyte-db 5432; do echo waiting for db; sleep 2; done']
      containers:
      - name: bootloader
        image: airbyte/bootloader:0.58.0
        envFrom:
        - configMapRef:
            name: {{ include "dalgo.fullname" . }}-airbyte-config
        env:
        - name: AIRBYTE_VERSION
          value: "0.58.0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dalgo.fullname" . }}-docker-proxy
  labels:
    {{- include "dalgo.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "dalgo.fullname" . }}-docker-proxy
  template:
    metadata:
      labels:
        app: {{ include "dalgo.fullname" . }}-docker-proxy
    spec:
      containers:
      - name: socat
        image: alpine/socat
        command: ["socat", "-t", "900", "TCP-LISTEN:2375,fork,reuseaddr", "UNIX-CONNECT:/var/run/docker.sock"]
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: docker-sock
          mountPath: /var/run/docker.sock
      volumes:
      - name: docker-sock
        hostPath:
          path: /var/run/docker.sock
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dalgo.fullname" . }}-docker-proxy
  labels:
    {{- include "dalgo.labels" . | nindent 4 }}
spec:
  ports:
  - port: 2375
    targetPort: 2375
  selector:
    app: {{ include "dalgo.fullname" . }}-docker-proxy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dalgo.fullname" . }}-airbyte-server
  labels:
    {{- include "dalgo.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "dalgo.fullname" . }}-airbyte-server
  template:
    metadata:
      labels:
        app: {{ include "dalgo.fullname" . }}-airbyte-server
    spec:
      initContainers:
      - name: wait-for-temporal
        image: busybox
        command: ['sh', '-c', 'until nc -z {{ include "dalgo.fullname" . }}-airbyte-temporal 7233; do echo waiting for temporal; sleep 2; done']
      containers:
      - name: server
        image: airbyte/server:0.58.0
        envFrom:
        - configMapRef:
            name: {{ include "dalgo.fullname" . }}-airbyte-config
        env:
        - name: AIRBYTE_VERSION
          value: "0.58.0"
        ports:
        - containerPort: 8001
        volumeMounts:
        - name: workspace-vol
          mountPath: /tmp/workspace
        - name: local-root-vol
          mountPath: /tmp/airbyte_local
      volumes:
      - name: workspace-vol
        emptyDir: {}
      - name: local-root-vol
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dalgo.fullname" . }}-airbyte-server
  labels:
    {{- include "dalgo.labels" . | nindent 4 }}
spec:
  ports:
  - port: 8001
    targetPort: 8001
  selector:
    app: {{ include "dalgo.fullname" . }}-airbyte-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dalgo.fullname" . }}-airbyte-worker
  labels:
    {{- include "dalgo.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "dalgo.fullname" . }}-airbyte-worker
  template:
    metadata:
      labels:
        app: {{ include "dalgo.fullname" . }}-airbyte-worker
    spec:
      initContainers:
      - name: wait-for-server
        image: busybox
        command: ['sh', '-c', 'until nc -z {{ include "dalgo.fullname" . }}-airbyte-server 8001; do echo waiting for server; sleep 2; done']
      containers:
      - name: worker
        image: airbyte/worker:0.58.0
        envFrom:
        - configMapRef:
            name: {{ include "dalgo.fullname" . }}-airbyte-config
        env:
        - name: AIRBYTE_VERSION
          value: "0.58.0"
        - name: DOCKER_HOST
          value: "{{ include "dalgo.fullname" . }}-docker-proxy:2375"
        ports:
        - containerPort: 9000
        volumeMounts:
        - name: workspace-vol
          mountPath: /tmp/workspace
        - name: local-root-vol
          mountPath: /tmp/airbyte_local
      volumes:
      - name: workspace-vol
        emptyDir: {}
      - name: local-root-vol
        emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dalgo.fullname" . }}-airbyte-webapp
  labels:
    {{- include "dalgo.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "dalgo.fullname" . }}-airbyte-webapp
  template:
    metadata:
      labels:
        app: {{ include "dalgo.fullname" . }}-airbyte-webapp
    spec:
      containers:
      - name: webapp
        image: airbyte/webapp:0.58.0
        envFrom:
        - configMapRef:
            name: {{ include "dalgo.fullname" . }}-airbyte-config
        env:
        - name: INTERNAL_API_HOST
          value: "{{ include "dalgo.fullname" . }}-airbyte-server:8001"
        - name: INTERNAL_API_URL
          value: "http://{{ include "dalgo.fullname" . }}-airbyte-server:8001"
        - name: KEYCLOAK_INTERNAL_HOST
          value: "localhost"
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dalgo.fullname" . }}-airbyte-webapp
  labels:
    {{- include "dalgo.labels" . | nindent 4 }}
spec:
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: {{ include "dalgo.fullname" . }}-airbyte-webapp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dalgo.fullname" . }}-airbyte-connector-builder-server
  labels:
    {{- include "dalgo.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "dalgo.fullname" . }}-airbyte-connector-builder-server
  template:
    metadata:
      labels:
        app: {{ include "dalgo.fullname" . }}-airbyte-connector-builder-server
    spec:
      containers:
      - name: builder-server
        image: airbyte/connector-builder-server:0.58.0
        envFrom:
        - configMapRef:
            name: {{ include "dalgo.fullname" . }}-airbyte-config
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dalgo.fullname" . }}-airbyte-connector-builder-server
  labels:
    {{- include "dalgo.labels" . | nindent 4 }}
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: {{ include "dalgo.fullname" . }}-airbyte-connector-builder-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dalgo.fullname" . }}-airbyte-api-server
  labels:
    {{- include "dalgo.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "dalgo.fullname" . }}-airbyte-api-server
  template:
    metadata:
      labels:
        app: {{ include "dalgo.fullname" . }}-airbyte-api-server
    spec:
      containers:
      - name: api-server
        image: airbyte/airbyte-api-server:0.58.0
        envFrom:
        - configMapRef:
            name: {{ include "dalgo.fullname" . }}-airbyte-config
        ports:
        - containerPort: 8006
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dalgo.fullname" . }}-airbyte-api-server
  labels:
    {{- include "dalgo.labels" . | nindent 4 }}
spec:
  ports:
  - port: 8006
    targetPort: 8006
  selector:
    app: {{ include "dalgo.fullname" . }}-airbyte-api-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dalgo.fullname" . }}-airbyte-cron
  labels:
    {{- include "dalgo.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "dalgo.fullname" . }}-airbyte-cron
  template:
    metadata:
      labels:
        app: {{ include "dalgo.fullname" . }}-airbyte-cron
    spec:
      containers:
      - name: cron
        image: airbyte/cron:0.58.0
        envFrom:
        - configMapRef:
            name: {{ include "dalgo.fullname" . }}-airbyte-config
        volumeMounts:
        - name: workspace-vol
          mountPath: /tmp/workspace
      volumes:
      - name: workspace-vol
        emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dalgo.fullname" . }}-airbyte-proxy
  labels:
    {{- include "dalgo.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "dalgo.fullname" . }}-airbyte-proxy
  template:
    metadata:
      labels:
        app: {{ include "dalgo.fullname" . }}-airbyte-proxy
    spec:
      initContainers:
      - name: wait-for-webapp
        image: busybox
        command: ['sh', '-c', 'until nc -z {{ include "dalgo.fullname" . }}-airbyte-webapp 80; do echo waiting for webapp; sleep 2; done']
      containers:
      - name: proxy
        image: airbyte/proxy:0.58.0
        envFrom:
        - configMapRef:
            name: {{ include "dalgo.fullname" . }}-airbyte-config
        env:
        - name: PROXY_PASS_WEB
          value: "http://{{ include "dalgo.fullname" . }}-airbyte-webapp:80"
        - name: PROXY_PASS_API
          value: "http://{{ include "dalgo.fullname" . }}-airbyte-server:8001"
        - name: CONNECTOR_BUILDER_SERVER_API
          value: "http://{{ include "dalgo.fullname" . }}-airbyte-connector-builder-server:8080"
        - name: PROXY_PASS_AIRBYTE_API_SERVER
          value: "http://{{ include "dalgo.fullname" . }}-airbyte-api-server:8006"
        ports:
        - containerPort: 8000
          name: http
        - containerPort: 8001
          name: server
        - containerPort: 8006
          name: api
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dalgo.fullname" . }}-airbyte-proxy
  labels:
    {{- include "dalgo.labels" . | nindent 4 }}
spec:
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  - port: 8001
    targetPort: 8001
    name: server
  - port: 8006
    targetPort: 8006
    name: api
  selector:
    app: {{ include "dalgo.fullname" . }}-airbyte-proxy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dalgo.fullname" . }}-airbyte-minio
  labels:
    {{- include "dalgo.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "dalgo.fullname" . }}-airbyte-minio
  template:
    metadata:
      labels:
        app: {{ include "dalgo.fullname" . }}-airbyte-minio
    spec:
      containers:
      - name: minio
        image: minio/minio:RELEASE.2024-01-28T22-35-53Z
        command: ["sh", "-c", "mkdir -p /data/airbyte-logs /data/airbyte-state /data/airbyte-workload-output /data/airbyte-activity-payload && exec minio server /data --console-address :9001"]
        env:
        - name: MINIO_ROOT_USER
          value: "minioadmin"
        - name: MINIO_ROOT_PASSWORD
          value: "minioadmin"
        ports:
        - containerPort: 9000
          name: api
        - containerPort: 9001
          name: console
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dalgo.fullname" . }}-airbyte-minio
  labels:
    {{- include "dalgo.labels" . | nindent 4 }}
spec:
  ports:
  - port: 9000
    targetPort: 9000
    name: api
  - port: 9001
    targetPort: 9001
    name: console
  selector:
    app: {{ include "dalgo.fullname" . }}-airbyte-minio
{{- end }}
