{{- if .Values.webapp.enabled -}}
{{- $host := "localhost" -}}
{{- if and .Values.ingress.enabled .Values.ingress.hosts -}}
  {{- $firstHost := index .Values.ingress.hosts 0 -}}
  {{- $host = $firstHost.host -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dalgo.fullname" . }}-webapp-config
  labels:
    {{- include "dalgo.labels" . | nindent 4 }}
data:
  NEXT_PUBLIC_BACKEND_URL: {{ default (printf "http://%s:8002" $host) .Values.webapp.backendUrl | quote }}
  NEXT_PUBLIC_WEBSOCKET_URL: {{ default (printf "ws://%s:8002" $host) .Values.webapp.websocketUrl | quote }}
  NEXTAUTH_URL: {{ default (printf "http://%s:3000" $host) .Values.webapp.nextAuthUrl | quote }}
  NEXT_PUBLIC_USAGE_DASHBOARD_ID: {{ .Values.webapp.usageDashboardId | default "" | quote }}
  NEXT_PUBLIC_USAGE_DASHBOARD_DOMAIN: {{ .Values.webapp.usageDashboardDomain | default "" | quote }}
  NEXT_PUBLIC_DEMO_ACCOUNT_DEST_SCHEMA: {{ .Values.webapp.demoAccountDestSchema | default "demostaging" | quote }}
  NEXT_PUBLIC_DEMO_WALKTHROUGH_ENABLED: {{ .Values.webapp.demoWalkthroughEnabled | default "true" | quote }}
  NEXT_PUBLIC_AIRBYTE_URL: {{ .Values.webapp.airbyteUrl | default "http://localhost:8000" | quote }}
  NEXT_PUBLIC_DALGO_WHITELIST_IPS: {{ .Values.webapp.whitelistIps | default "127.0.0.1" | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dalgo.fullname" . }}-webapp
  labels:
    {{- include "dalgo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.webapp.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "dalgo.fullname" . }}-webapp
  template:
    metadata:
      labels:
        app: {{ include "dalgo.fullname" . }}-webapp
    spec:
      containers:
        - name: webapp
          image: "{{ .Values.images.webapp.repository }}:{{ .Values.images.webapp.tag }}"
          imagePullPolicy: {{ .Values.images.webapp.pullPolicy }}
          ports:
            - containerPort: {{ .Values.webapp.port }}
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "dalgo.fullname" . }}-webapp-config
          env:
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "dalgo.fullname" . }}-secrets
                  key: NEXTAUTH_SECRET
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dalgo.fullname" . }}-webapp
  labels:
    {{- include "dalgo.labels" . | nindent 4 }}
spec:
  ports:
    - port: {{ .Values.webapp.port }}
      targetPort: http
      name: http
  selector:
    app: {{ include "dalgo.fullname" . }}-webapp
{{- end }}
